# Anteprima gratuita su GitHub Pages: pubblica il ramo scelto nel ramo "gh-pages".
# Sito: https://<utente>.github.io/<repo>/studio/
name: Anteprima GitHub Pages
on:
  push:
    branches: ['feature/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito (percorsi assoluti /studio/ -> /<repo>/studio/)
        run: |
          mkdir _site
          cp -r index.html studio _site/
          repo="${GITHUB_REPOSITORY#*/}"
          grep -rlE '/studio/' _site --include='*.js' --include='*.html' --include='*.css' --include='*.webmanifest' | xargs -r sed -i -E "s#(^|[^A-Za-z0-9_./-])/studio/#\1/${repo}/studio/#g"
          touch _site/.nojekyll
      - name: Pubblica su gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Anteprima da ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
